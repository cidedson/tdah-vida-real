<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f5f5b">
<title>TDAH na Vida Real</title>
<link rel="icon" href="data:,">
<style>
@font-face { font-family: 'Jakarta'; font-style: normal; font-display: swap; font-weight: 200 800; src: url(fonts/jakarta.woff2) format('woff2'); }
:root {
  --bg: #f4f3ef; --card: #fdfcf9; --ink: #17201e; --muted: #55605c; --line: #eceae3; --line2: #dad7cf;
  --accent: #1f5f5b; --accent-ink: #133f3b; --accent-soft: #dcebe8; --on-accent: #fdfcf9;
  --warn: #8a3a14; --warn-soft: #fbe6da; --coral: #f0a37a; --ok: #2f7a3f;
  --hero: #1f5f5b; --hero-ink: #fdfcf9; --hero-sub: #c9e3de; --hero-chip: #9fe0d4;
  --shadow: 0 1px 2px rgba(23, 32, 30, 0.06), 0 1px 1px rgba(23, 32, 30, 0.03);
  --top: max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px));
  --bottom: max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px));
  color-scheme: light;
}
:root[data-theme="escuro"] {
  --bg: #0f1716; --card: #182220; --ink: #e8eeec; --muted: #9aa9a5; --line: #26322f; --line2: #34423f;
  --accent: #6fc2b8; --accent-ink: #9fe0d4; --accent-soft: #1e3532; --on-accent: #0f1f1d;
  --warn: #f4b08e; --warn-soft: #3a2a20; --ok: #7fd08f;
  --hero: #1e4a46; --hero-ink: #eef3f1; --hero-sub: #b4cfca; --hero-chip: #9fe0d4;
  --shadow: none; color-scheme: dark;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="claro"]) {
    --bg: #0f1716; --card: #182220; --ink: #e8eeec; --muted: #9aa9a5; --line: #26322f; --line2: #34423f;
    --accent: #6fc2b8; --accent-ink: #9fe0d4; --accent-soft: #1e3532; --on-accent: #0f1f1d;
    --warn: #f4b08e; --warn-soft: #3a2a20; --ok: #7fd08f;
    --hero: #1e4a46; --hero-ink: #eef3f1; --hero-sub: #b4cfca; --hero-chip: #9fe0d4;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 'Jakarta', system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(96px + var(--bottom)); }
body.nonav { padding-bottom: calc(24px + var(--bottom)); }
body.focus-bg { background: #0f1f1d; padding-bottom: 0; }
a { color: var(--accent); }

/* Barra superior */
.appbar, header.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + var(--top)) 12px 8px; display: flex; align-items: center; gap: 6px; }
header.top { display: block; padding: calc(16px + var(--top)) 18px 10px; }
.appbar .ttl { flex: 1; min-width: 0; }
.appbar h1, header.top h1 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.01em; line-height: 1.25; }
.appbar h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appbar .sub, header.top .sub { color: var(--muted); font-size: 13px; }
.iconbtn { width: 44px; height: 44px; flex: none; border: 0; border-radius: 14px; background: transparent; color: var(--ink); display: grid; place-items: center; padding: 0; min-height: 0; }
.iconbtn:active { background: var(--accent-soft); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; padding: 6px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); white-space: nowrap; border: 0; min-height: 0; }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
main { padding: 4px 16px 24px; max-width: 720px; margin: 0 auto; }

/* Cartões e texto */
.card { background: var(--card); border-radius: 22px; padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow); }
:root[data-theme="escuro"] .card { border: 1px solid var(--line); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="claro"]) .card { border: 1px solid var(--line); } }
.card h2 { font-size: 17px; font-weight: 800; margin: 0 0 8px; letter-spacing: -0.01em; }
.card h3 { font-size: 14px; font-weight: 700; margin: 14px 0 6px; }
.eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); margin: 0; }
.hint { color: var(--muted); font-size: 14px; margin: 0 0 10px; }
.small { font-size: 13px; color: var(--muted); }
.muted { color: var(--muted); }
.mt { margin-top: 10px; }
.right { text-align: right; }
.hidden { display: none !important; }

/* Campos e botões */
input[type=text], input[type=time], input[type=datetime-local], input[type=number], input[type=date], textarea, select {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line2);
  border-radius: 14px; padding: 11px 14px; outline: none;
}
.card input[type=text], .card input[type=time], .card input[type=datetime-local], .card input[type=number], .card textarea, .card select { background: var(--bg); }
input:focus, textarea:focus, select:focus { border-color: var(--accent); }
textarea { min-height: 84px; resize: vertical; }
button { font: inherit; font-weight: 700; border: 0; border-radius: 14px; padding: 11px 16px; min-height: 44px; background: var(--accent); color: var(--on-accent); cursor: pointer; }
button:disabled { opacity: 0.5; }
button.ghost { background: transparent; color: var(--accent); border: 1.5px solid var(--line2); }
button.danger { background: var(--warn-soft); color: var(--warn); }
button.mini { padding: 7px 12px; font-size: 14px; min-height: 36px; border-radius: 12px; }
button.icon { background: transparent; color: var(--muted); padding: 6px 8px; font-size: 18px; line-height: 1; min-height: 0; }
.row { display: flex; gap: 8px; align-items: center; }
.row > .grow, .grow { flex: 1; min-width: 0; }
.stack > * + * { margin-top: 8px; }
.pills { display: flex; gap: 6px; flex-wrap: wrap; }
.pill { border: 1.5px solid var(--line2); background: var(--card); color: var(--ink); border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; min-height: 0; }
.pill.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 12px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg .pill { white-space: nowrap; }

/* Listas e marcadores */
.check { display: flex; gap: 12px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.check:last-child { border-bottom: 0; }
.box { flex: none; width: 24px; height: 24px; border-radius: 8px; border: 2px solid var(--accent); display: grid; place-items: center; margin-top: 1px; }
.check.on .box { background: var(--accent); }
.check.on .box::after { content: ""; width: 6px; height: 11px; border: solid var(--on-accent); border-width: 0 2.5px 2.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.check.on .lbl { color: var(--muted); text-decoration: line-through; }
.check.toggle.on .lbl { color: var(--ink); text-decoration: none; }
.top3 { background: var(--bg); border-radius: 16px; padding: 12px; margin-bottom: 8px; }
.top3 .num { flex: none; width: 26px; height: 26px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-ink); display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.top3.done .num { background: var(--accent); color: var(--on-accent); }
.ev { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ev:last-child { border-bottom: 0; }
.ev .t { width: 52px; flex: none; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; font-size: 14px; }
.ev .dot { width: 8px; height: 8px; border-radius: 50%; margin-top: 7px; flex: none; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.alert { background: var(--warn-soft); color: var(--warn); border-radius: 16px; padding: 12px 14px; font-size: 14px; line-height: 1.45; }
.list-item { display: flex; gap: 8px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.list-item:last-child { border-bottom: 0; }
.strat { padding: 12px 0; border-bottom: 1px solid var(--line); }
.strat:last-child { border-bottom: 0; }
.strat .ttl { font-weight: 700; }
.strat .n { color: var(--accent); font-weight: 800; margin-right: 4px; }
.star { background: transparent; color: var(--muted); font-size: 22px; padding: 2px 6px; min-height: 0; }
.star.on { color: #d9a400; }
details > summary { cursor: pointer; list-style: none; font-weight: 700; font-size: 17px; }
details > summary::-webkit-details-marker { display: none; }
details > summary::after { content: "+"; float: right; color: var(--muted); }
details[open] > summary::after { content: "–"; }
.habit-boxes { display: flex; gap: 6px; margin-top: 6px; }
.hb { width: 36px; height: 36px; border-radius: 10px; border: 2px solid var(--line2); background: var(--card); color: var(--accent); font-weight: 800; padding: 0; min-height: 0; }
.hb.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }

/* Hoje */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: 18px; margin-bottom: 12px; }
.hero .eyebrow { color: var(--hero-chip); }
.hero .sub2 { color: var(--hero-sub); font-size: 14px; line-height: 1.45; margin: 0; }
.hero button { font-size: 14px; padding: 11px 8px; }
.hero button.light { background: var(--hero-ink); color: var(--hero); flex: 1; }
.hero button.outline { background: transparent; color: var(--hero-ink); border: 1.5px solid rgba(255, 255, 255, 0.35); flex: 1; }
.hero .bigname { font-size: 22px; font-weight: 800; margin: 4px 0 0; letter-spacing: -0.01em; }
.abtn { display: inline-flex; align-items: center; justify-content: center; text-decoration: none; font-weight: 700; border-radius: 14px; padding: 11px 16px; min-height: 44px; background: var(--accent); color: var(--on-accent); }
.hero .abtn.light { background: var(--hero-ink); color: var(--hero); flex: 1; font-size: 14px; padding: 11px 8px; }
.updnotes { margin: 8px 0 0; padding-left: 18px; color: var(--hero-sub); font-size: 14px; line-height: 1.45; }
.updnotes li { margin: 3px 0; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 12px; }
.quick button { background: var(--card); color: var(--ink); box-shadow: var(--shadow); border-radius: 18px; padding: 12px 2px 10px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 12px; font-weight: 700; }
.quick .qi { width: 40px; height: 40px; border-radius: 14px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; }
.quick .qi.warm { background: var(--warn-soft); color: var(--warn); }

/* Remédios */
.segbar { display: grid; gap: 5px; margin-top: 12px; }
.segbar i { height: 8px; border-radius: 4px; background: var(--line2); }
.segbar i.on { background: var(--accent); }
.dose-row { display: flex; align-items: center; gap: 12px; min-height: 52px; border-bottom: 1px solid var(--line); }
.dose-row:last-child { border-bottom: 0; }
.dose-row .t { width: 48px; flex: none; font-weight: 700; font-variant-numeric: tabular-nums; }
.dose-row .nm { flex: 1; min-width: 0; font-weight: 600; }
.dose-row.done .t, .dose-row.done .nm { color: var(--muted); }
.dose-row .st { font-size: 12px; font-weight: 600; color: var(--accent); }
.circ { flex: none; width: 34px; height: 34px; border-radius: 17px; border: 2px solid var(--accent); background: transparent; padding: 0; min-height: 0; color: var(--on-accent); display: grid; place-items: center; }
.circ.on { background: var(--accent); }

/* Prioridades */
.mhead { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 4px 0 6px; }
.mhead .eyebrow { text-align: center; }
.matrix { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px; }
.quad { border-radius: 20px; padding: 12px; min-height: 140px; }
.quad .qt { margin: 0; font-size: 15px; font-weight: 800; }
.quad .qs { margin: 1px 0 0; font-size: 11px; color: var(--muted); }
.quad.q1 { background: var(--warn-soft); } .quad.q1 .qt { color: var(--warn); }
.quad.q2 { background: var(--accent-soft); } .quad.q2 .qt { color: var(--accent-ink); }
.quad.q3 { background: var(--card); border: 1.5px solid var(--line2); }
.quad.q4 { border: 1.5px dashed var(--line2); } .quad.q4 .qt { color: var(--muted); }
.tk { display: block; width: 100%; text-align: left; background: var(--card); color: var(--ink); border-radius: 12px; padding: 8px 10px; margin-top: 7px; min-height: 0; font-size: 13px; font-weight: 700; line-height: 1.3; }
.tk span { display: block; font-size: 11px; font-weight: 500; color: var(--muted); margin-top: 2px; }
.quad.q3 .tk { background: var(--bg); }
.tk.plain { background: transparent; padding: 0; margin: 0; font-size: 15px; }
/* v1.7: categorias, captura, repetição */
.cdot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; flex: none; }
.pill .cdot { margin-right: 5px; }
.catbar { flex-wrap: nowrap; overflow-x: auto; margin: 0 -2px 10px; padding: 2px; scrollbar-width: none; }
.catbar::-webkit-scrollbar { display: none; }
.catbar .pill { white-space: nowrap; }
.cchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.cchip { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 5px 10px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-ink); }
.cchip svg { flex: none; }
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; }
.grid2 > * { min-width: 0; }
.grid2 label, label.mt { display: block; }
.grid2 input { width: 100%; min-width: 0; box-sizing: border-box; }
details > summary.fsum { display: flex; align-items: center; gap: 10px; }
details > summary.fsum::after { float: none; margin-left: auto; font-size: 20px; }
.wdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.wdays button { min-height: 0; height: 40px; padding: 0; border-radius: 12px; background: var(--card); color: var(--ink); border: 1.5px solid var(--line2); font-weight: 800; font-size: 14px; }
.wdays button.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.cswatch { width: 34px; height: 34px; min-height: 0; padding: 0; border-radius: 50%; flex: none; border: 3px solid var(--card); box-shadow: 0 0 0 1.5px var(--line2); }
/* humor */
.moods { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
.moods button { background: var(--bg); color: var(--ink); border-radius: 16px; padding: 10px 2px 8px; min-height: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; }
.moods button:active { transform: scale(.96); }
.fortune { margin-top: 12px; background: var(--accent-soft); border-radius: 16px; padding: 11px 14px; }
.fortune .eyebrow { color: var(--accent-ink); }
.fortune p:last-child { margin: 3px 0 0; font-size: 15px; font-weight: 600; line-height: 1.45; color: var(--ink); }
.fortune.pop { animation: pop .5s ease-out; }
@keyframes pop { 0% { transform: scale(.94); opacity: 0; } 60% { transform: scale(1.02); opacity: 1; } 100% { transform: none; } }
@media (prefers-reduced-motion: reduce) { .fortune.pop { animation: none; } }
.moodweek { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 6px; }
.moodweek > div { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 5px 0 3px; border-radius: 12px; }
.moodweek > div.today { background: var(--bg); }
.moodweek small { font-size: 11px; font-weight: 700; color: var(--muted); }
.mdot { display: block; width: 22px; height: 22px; border-radius: 50%; border: 1.5px dashed var(--line2); box-sizing: border-box; }
/* resumo da semana */
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.stat { background: var(--bg); border-radius: 16px; padding: 11px 12px; }
.stat b { display: block; font-size: 24px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.1; }
.stat span { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }
.weekcard button.light { background: var(--accent); color: var(--on-accent); }
/* 1.9: Hoje mais limpo */
.hero.agora { padding: 16px; }
.hero.agora .bigname { font-size: 20px; line-height: 1.2; overflow-wrap: anywhere; }
.hero.agora .eyebrow { margin: 0; }
.ringbox { position: relative; width: 56px; height: 56px; flex: none; }
.ringbox b { position: absolute; inset: 0; display: grid; place-items: center; font-size: 14px; font-weight: 800; }
.hero .carry { margin-top: 10px; display: flex; gap: 6px; align-items: flex-start; font-size: 13px; }
.hero .carry svg { flex: none; margin-top: 2px; }
.hero .acts { gap: 8px; margin-top: 12px; }
.hero .acts button { display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.moodstrip { padding: 10px 14px; }
.moodstrip .lbl { display: block; font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.mfaces { display: flex; justify-content: space-between; }
.mfaces button { background: transparent; padding: 2px; min-height: 0; border-radius: 50%; }
.mfaces button:active { transform: scale(.92); }
.mrow { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; color: var(--ink); padding: 0; min-height: 34px; text-align: left; font-weight: 500; }
.mrow svg:last-child { color: var(--muted); flex: none; }
.meudia { padding-bottom: 10px; }
.iconbtn.sm { width: 38px; height: 38px; min-height: 0; border-radius: 13px; background: var(--accent-soft); color: var(--accent); margin-left: 8px; }
.dchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 2px; }
.dchips .chip { display: inline-flex; align-items: center; gap: 5px; }
.dempty { margin-top: 12px; background: var(--bg); border-radius: 16px; padding: 12px; }
.dper { margin-top: 10px; }
.dph { display: flex; align-items: center; gap: 6px; width: 100%; background: transparent; color: var(--muted); padding: 6px 0; min-height: 0; font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; border-bottom: 1px solid var(--line); border-radius: 0; text-align: left; margin: 0; }
p.dph { margin: 0; }
.dph .small { text-transform: none; letter-spacing: 0; font-weight: 600; }
.dph svg { flex: none; }
.dper.now .dph { color: var(--accent-ink); }
.nowtag { font-size: 10px; letter-spacing: .06em; background: var(--accent-soft); color: var(--accent-ink); border-radius: 999px; padding: 2px 7px; }
.drow { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.drow:last-child { border-bottom: 0; }
.drow .dtxt { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; column-gap: 6px; cursor: pointer; }
.drow .dt { font-weight: 600; font-size: 15px; line-height: 1.3; }
.drow .ds { flex-basis: 100%; font-size: 12px; color: var(--muted); margin-top: 1px; }
.drow .dtime { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.drow .dstar { color: #d99a16; font-size: 14px; }
.drow.prio .dt { font-weight: 800; }
.drow.done .dt { text-decoration: line-through; color: var(--muted); font-weight: 600; }
.dbox { width: 26px; height: 26px; min-height: 0; padding: 0; border-radius: 8px; background: transparent; border: 2px solid var(--line2); color: var(--on-accent); display: grid; place-items: center; flex: none; }
.dbox.on { background: var(--accent); border-color: var(--accent); }
.dico { width: 26px; height: 26px; display: grid; place-items: center; color: var(--muted); flex: none; }
.dgo { width: 36px; height: 36px; min-height: 0; padding: 0; border-radius: 12px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.mais { padding: 12px 14px 6px; }
.mitem { border-bottom: 1px solid var(--line); }
.mitem:last-child { border-bottom: 0; }
.mhead2 { display: flex; align-items: center; gap: 10px; width: 100%; background: transparent; color: var(--ink); padding: 10px 0; min-height: 0; text-align: left; font-weight: 600; font-size: 15px; border-radius: 0; }
.mhead2 .mi { color: var(--accent); display: grid; place-items: center; }
.mhead2 .small { color: var(--muted); }
.mhead2 svg:last-child { color: var(--muted); flex: none; }
.mbody { padding: 2px 0 12px; }
.stepper { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; margin-bottom: 12px; }
.stepper div { height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; font-weight: 700; background: var(--line); color: var(--muted); }
.stepper div.done { background: var(--accent); color: var(--on-accent); }
.stepper div.cur { background: var(--card); border: 2px solid var(--accent); color: var(--accent-ink); font-weight: 800; }
.steps .steprow, .steprow { display: flex; gap: 10px; align-items: center; min-height: 46px; border-bottom: 1px solid var(--line); font-size: 14px; }
.steprow:last-child { border-bottom: 0; }
.steprow.done .grow { color: var(--muted); text-decoration: line-through; }
.sn { flex: none; width: 26px; height: 26px; border-radius: 13px; background: var(--accent-soft); color: var(--accent-ink); font-size: 12px; font-weight: 800; display: grid; place-items: center; }
.sn.cur { background: var(--accent); color: var(--on-accent); }
.sn.ok { background: var(--accent); color: var(--on-accent); }
.title-input { font-size: 20px !important; font-weight: 800 !important; border: 0 !important; background: transparent !important; padding: 2px 0 !important; border-radius: 0 !important; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 33; background: var(--card); border-radius: 28px 28px 0 0; padding: 10px 16px calc(20px + var(--bottom)); max-height: 92vh; overflow-y: auto; animation: up 0.22s ease-out; max-width: 720px; margin: 0 auto; }

@keyframes up { from { transform: translateY(100%); } to { transform: none; } }

/* Navegação inferior */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; background: var(--card); border-top: 1px solid var(--line); padding: 6px 0 calc(8px + var(--bottom)); }
nav.tabs button { background: transparent; color: var(--muted); border-radius: 0; padding: 4px 0; min-height: 0; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 4px; }
nav.tabs .icw { display: flex; padding: 4px 16px; border-radius: 999px; }
nav.tabs button.on { color: var(--accent); font-weight: 800; }
nav.tabs button.on .icw { background: var(--accent-soft); }
nav.tabs button.fab { width: 60px; height: 60px; border-radius: 30px; justify-self: center; margin-top: -30px; background: var(--accent); color: var(--on-accent); box-shadow: 0 8px 20px rgba(31, 95, 91, 0.35); padding: 0; display: grid; place-items: center; }

/* Menu lateral */
.scrim { position: fixed; inset: 0; background: rgba(15, 31, 29, 0.45); z-index: 30; animation: fade 0.18s ease-out; }
.drawer { position: fixed; top: 0; bottom: 0; left: 0; width: min(318px, 86vw); background: var(--card); z-index: 31; border-radius: 0 28px 28px 0; padding: calc(14px + var(--top)) 12px calc(14px + var(--bottom)); overflow-y: auto; animation: slide 0.22s ease-out; display: flex; flex-direction: column; }
.drawer .who { display: flex; gap: 12px; align-items: center; padding: 6px 10px 12px; }
.avatar { width: 44px; height: 44px; flex: none; border-radius: 22px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-size: 18px; font-weight: 800; }
.drawer .grp { font-size: 11px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); padding: 14px 14px 4px; margin: 0; }
.drawer .item { display: flex; align-items: center; gap: 14px; width: 100%; background: transparent; color: var(--ink); border-radius: 999px; padding: 0 14px; height: 48px; min-height: 0; font-size: 15px; font-weight: 600; text-align: left; }
.drawer .item.on { background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }
.drawer .item .cnt { margin-left: auto; font-size: 12px; font-weight: 700; color: var(--muted); }
.drawer .item.on .cnt { color: var(--accent-ink); }
.drawer .foot { margin-top: auto; border-top: 1px solid var(--line); padding-top: 8px; }
@keyframes slide { from { transform: translateX(-100%); } to { transform: none; } }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }

/* Assistente */
.msgs { display: flex; flex-direction: column; gap: 10px; }
.bubble { line-height: 1.45; }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-radius: 20px 20px 6px 20px; padding: 12px 14px; max-width: 85%; }
.bubble.ai { align-self: flex-start; background: var(--card); border-radius: 20px 20px 20px 6px; padding: 14px 16px; box-shadow: var(--shadow); max-width: 94%; }
main.chat { padding-bottom: calc(200px + var(--bottom)); }
.composer { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; background: var(--card); border-top: 1px solid var(--line); padding: 10px 16px calc(12px + var(--bottom)); }
.composer textarea { min-height: 48px; height: 48px; border-radius: 24px; resize: none; padding: 12px 16px; }
.composer .send { width: 48px; height: 48px; border-radius: 24px; padding: 0; flex: none; display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.composer .microw { display: flex; align-items: center; justify-content: space-between; margin-top: 10px; }
.micbig { width: 64px; height: 64px; border-radius: 32px; padding: 0; display: grid; place-items: center; box-shadow: 0 0 0 7px var(--accent-soft); }
.suggest { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; scrollbar-width: none; }
.suggest::-webkit-scrollbar { display: none; }
.suggest button { flex: none; background: var(--card); color: var(--ink); border: 1.5px solid var(--line2); border-radius: 999px; padding: 8px 14px; min-height: 0; font-size: 13px; font-weight: 600; }

/* Foco (sempre escuro) */
.focus { color: #eef3f1; min-height: 100vh; background: #0f1f1d; padding: calc(10px + var(--top)) 16px calc(24px + var(--bottom)); max-width: 720px; margin: 0 auto; }
.focus .appbar { background: transparent; padding: 0 0 8px; position: static; }
.focus .appbar .sub { color: #a9c3be; }
.focus .iconbtn { color: #eef3f1; }
.focus .iconbtn:active { background: #182b28; }
.fcard { background: #182b28; border-radius: 20px; padding: 14px 16px; margin-top: 12px; }
.focus .eyebrow { color: #6fc2b8; }
.focus .muted2, .focus .hint, .focus .small { color: #a9c3be; }
.focus button.fbtn { background: #6fc2b8; color: #0f1f1d; }
.focus button.outline { background: transparent; border: 1.5px solid #34514d; color: #eef3f1; }
.focus button.coral { background: #f0a37a; color: #2a1206; }
.focus .pill { background: transparent; border-color: #34514d; color: #eef3f1; }
.focus .pill.on { background: #6fc2b8; border-color: #6fc2b8; color: #0f1f1d; }
.focus input[type=text] { background: #182b28; border-color: #34514d; color: #eef3f1; }
.focus .check { border-color: #22403c; }
.focus .check .box { border-color: #6fc2b8; }
.focus .check.on .box { background: #6fc2b8; }
.focus .check.on .box::after { border-color: #0f1f1d; }
.focus .check.on .lbl { color: #a9c3be; }
.ringwrap { position: relative; width: 240px; height: 240px; margin: 22px auto 0; }
.ringwrap .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-align: center; }
.ftime { font-size: 52px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -1px; margin: 0; line-height: 1; }
.fctl { display: flex; justify-content: center; align-items: center; gap: 22px; margin-top: 20px; }
.fctl .side { width: 72px; height: 48px; padding: 0; border-radius: 16px; font-size: 14px; }
.fctl .main { width: 76px; height: 76px; border-radius: 38px; padding: 0; display: grid; place-items: center; }

/* Ajustes */
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.themes button { background: transparent; color: var(--ink); border: 1.5px solid var(--line2); border-radius: 16px; padding: 10px 6px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 13px; }
.themes button.on { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); font-weight: 800; }
.themes .pv { display: flex; width: 54px; height: 70px; border-radius: 10px; overflow: hidden; border: 1px solid var(--line2); }
.setrow { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--line); }
.setrow:last-child { border-bottom: 0; }
.setrow .lb { flex: 1; min-width: 0; font-weight: 600; }
.switch { position: relative; width: 50px; height: 30px; flex: none; border-radius: 15px; background: var(--line2); padding: 0; min-height: 0; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 12px; background: #fff; transition: left 0.15s; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2); }
.switch.on { background: var(--accent); }
.switch.on::after { left: 23px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + var(--bottom)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; z-index: 40; opacity: 0; transition: opacity 0.2s; pointer-events: none; max-width: 90vw; text-align: center; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .scrim, .drawer, .sheet { animation: none; } .switch::after { transition: none; } }
</style>
